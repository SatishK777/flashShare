# ====================================
# FlashShare — Docker Compose (Dev)
# ====================================
# Provides PostgreSQL, Redis, and MinIO for local development.
# Usage: docker compose up -d

services:
  # ── PostgreSQL ────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: flashshare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flashshare
      POSTGRES_PASSWORD: flashshare_secret
      POSTGRES_DB: flashshare
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashshare"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: flashshare-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # ── MinIO (S3-compatible storage) ─────
  minio:
    image: minio/minio:latest
    container_name: flashshare-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9002:9000"   # API
      - "9003:9001"   # Console
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── MinIO Bucket Init ─────────────────
  minio-init:
    image: minio/mc:latest
    container_name: flashshare-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set flashshare http://minio:9000 minioadmin minioadmin123;
      mc mb flashshare/flashshare --ignore-existing;
      mc anonymous set download flashshare/flashshare;
      echo 'Bucket created successfully';
      exit 0;
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
